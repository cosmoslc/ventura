name: CI

# PR'da bir marta ishlaydi; push'da faqat main (PR branch'iga push qilinganda ikki marta ishlamasin)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm versiyasi package.json dagi "packageManager" dan olinadi
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Formatlash (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  tenant-db:
    # E0 qabuli: A mijoz B mijoz ma'lumotini ololmaydi — umumiy bazada ham, alohida bazalarda ham (RLS, FORCE)
    name: mijoz bazasi · ajratish va jurnal
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ventura
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: ventura_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventura -d ventura_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu vazifa ichidagi vaqtinchalik baza; testlar o'z bazalari va rollarini yaratadi
      TENANT_TEST_ADMIN_URL: postgres://ventura:e2e@localhost:5432/ventura_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Migratsiyalar sxema bilan mos (drizzle-kit generate yangi fayl chiqarmaydi)
        run: |
          pnpm --filter @ventura/db exec drizzle-kit generate --config drizzle.tenant.config.ts
          git diff --exit-code -- packages/db/migrations
          test -z "$(git status --porcelain -- packages/db/migrations)"

      - name: Ajratish testi, faoliyat jurnali va moliya hisobi
        run: pnpm --filter @ventura/db --filter @ventura/security --filter @ventura/edu-crm test

  e2e:
    name: e2e · kirish + 2FA, yangi loyiha formasi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ventura
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: ventura_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventura -d ventura_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu vazifa ichidagi vaqtinchalik baza; haqiqiy sirlar emas
      E2E_DATABASE_URL: postgres://ventura_app:e2e@localhost:5432/ventura_e2e
      E2E_MIGRATE_URL: postgres://ventura:e2e@localhost:5432/ventura_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Panel roli (audit jadvalini o'zgartira olmaydigan)
        run: psql "$E2E_MIGRATE_URL" -v ON_ERROR_STOP=1 -f apps/panel/e2e/roles.sql

      - name: Playwright brauzeri
        run: pnpm --filter @ventura/panel exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @ventura/panel build

      - name: E2E
        run: pnpm e2e

      - name: Yiqilgan test izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/panel/test-results
          retention-days: 7

  e2e-edu:
    # edu-crm asosiy oqimi (ADR 0029): kirish + 2FA, lid → o'quvchi. Markaz bazasi faqat shu vazifa ichida.
    name: e2e · edu-crm lid → o'quvchi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ventura
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: edu_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventura -d edu_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu vazifa ichidagi vaqtinchalik baza; haqiqiy sirlar emas
      E2E_EDU_DATABASE_URL: postgres://edu_e2e_app:e2e@localhost:5432/edu_e2e
      E2E_EDU_MIGRATE_URL: postgres://ventura:e2e@localhost:5432/edu_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Ilova roli (RLS chetlab o'tolmaydi)
        run: psql "$E2E_EDU_MIGRATE_URL" -v ON_ERROR_STOP=1 -c "CREATE ROLE edu_e2e_app LOGIN PASSWORD 'e2e' NOSUPERUSER NOBYPASSRLS"

      - name: Playwright brauzeri
        run: pnpm --filter @ventura/edu-crm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @ventura/edu-crm build

      - name: E2E
        run: pnpm e2e:edu

      - name: Yiqilgan test izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-edu-test-results
          path: apps/edu-crm/test-results
          retention-days: 7

  server-deploy:
    # Haqiqiy deploy: runner bir martalik Ubuntu mashina. setup.sh uni serverga aylantiradi, keyin panel navbati,
    # ishchi jarayon va SSH drayveri shu mashinaning o'ziga ikki loyihani joylaydi.
    name: server · setup.sh va haqiqiy deploy
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ventura
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: ventura_e2e
        ports:
          # 5432 emas: setup.sh mashinaning o'ziga ham PostgreSQL o'rnatadi
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U ventura -d ventura_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu vazifa ichidagi vaqtinchalik baza va kalitlar; haqiqiy sirlar emas
      E2E_DATABASE_URL: postgres://ventura_app:e2e@localhost:5433/ventura_e2e
      PANEL_DATABASE_URL: postgres://ventura_app:e2e@localhost:5433/ventura_e2e
      PANEL_MIGRATE_URL: postgres://ventura:e2e@localhost:5433/ventura_e2e
      BETTER_AUTH_SECRET: ci-faqat-test-uchun-maxfiy-satr-0123456789
      BETTER_AUTH_URL: http://localhost:3000
      DEPLOY_DRIVER: ssh
    steps:
      - uses: actions/checkout@v4

      - name: Toza serverga o'xshatish (runner'dagi tayyor Node olib tashlanadi)
        run: sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack /usr/local/bin/pnpm /usr/local/bin/pm2

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Panel bazasi
        run: |
          head -c 32 /dev/urandom | base64 > "$RUNNER_TEMP/master.key"
          echo "VENTURA_MASTER_KEY_FILE=$RUNNER_TEMP/master.key" >> "$GITHUB_ENV"
          psql "$PANEL_MIGRATE_URL" -v ON_ERROR_STOP=1 -f apps/panel/e2e/roles.sql
          pnpm db:migrate
          pnpm templates:sync

      - name: Qo'lda tekshiruvlar uchun kalit
        run: ssh-keygen -t ed25519 -N "" -C ventura-panel:ci -f "$RUNNER_TEMP/panel_key" -q

      - name: setup.sh
        run: sudo bash tooling/server/setup.sh --ssh-port 2222 --key "$(cat "$RUNNER_TEMP/panel_key.pub")"

      - name: Qayta ishga tushirish xavfsiz
        run: sudo bash tooling/server/setup.sh --ssh-port 2222 --key "$(cat "$RUNNER_TEMP/panel_key.pub")"

      - name: Kalit bilan kirish, dasturlar va huquqlar
        run: |
          SSH="ssh -p 2222 -i $RUNNER_TEMP/panel_key -o StrictHostKeyChecking=no -o BatchMode=yes deploy@127.0.0.1"
          $SSH 'bash -lc "node --version && pnpm --version && pm2 --version | tail -n 1 && psql --version"'
          $SSH 'sudo -n /usr/local/sbin/ventura-site check'
          test "$(sudo grep -c ventura-panel:ci /home/deploy/.ssh/authorized_keys)" = "1"
          # deploy root nomidan boshqa hech narsa ishlata olmaydi
          if $SSH 'sudo -n id' 2>/dev/null; then echo "deploy'da ortiqcha sudo huquqi bor"; exit 1; fi
          # parol bilan kirib bo'lmaydi
          if ssh -p 2222 -o StrictHostKeyChecking=no -o BatchMode=yes -o PubkeyAuthentication=no deploy@127.0.0.1 true 2>/dev/null; then exit 1; fi

      - name: Baza yordamchisi (ventura-db)
        run: |
          SSH="ssh -p 2222 -i $RUNNER_TEMP/panel_key -o StrictHostKeyChecking=no -o BatchMode=yes deploy@127.0.0.1"
          $SSH 'sudo -n /usr/local/sbin/ventura-db check'
          # Parol faqat stdin'dan; noto'g'ri nom, tizim bazasi va qisqa parol rad etiladi
          for bad in "ensure Edu x_role" "ensure postgres edu_x" "ensure edu_x postgres" "ensure 'a;drop' edu_x" "ensure edu_x"; do
            if echo "abcdefghijklmnopqrstuvwxyz012345" | $SSH "sudo -n /usr/local/sbin/ventura-db $bad" 2>/dev/null; then echo "rad etilmadi: $bad"; exit 1; fi
          done
          if echo "qisqa" | $SSH 'sudo -n /usr/local/sbin/ventura-db ensure edu_ci_probe edu_ci_probe' 2>/dev/null; then exit 1; fi
          # Bazalar ro'yxati (ADR 0057): yaratilgan baza TAB bilan ajratilgan qatorda, tizim bazasi yo'q
          echo "abcdefghijklmnopqrstuvwxyz012345" | $SSH 'sudo -n /usr/local/sbin/ventura-db ensure edu_ci_list edu_ci_list'
          LIST=$($SSH 'sudo -n /usr/local/sbin/ventura-db list')
          echo "$LIST" | grep -qP '^edu_ci_list\tedu_ci_list\t\d+\t\d+$' || { echo "ro'yxatda yo'q: $LIST"; exit 1; }
          if echo "$LIST" | grep -q '^postgres'; then echo "tizim bazasi ro'yxatda"; exit 1; fi

      - name: nginx yordamchisi (ventura-site)
        run: |
          SSH="ssh -p 2222 -i $RUNNER_TEMP/panel_key -o StrictHostKeyChecking=no -o BatchMode=yes deploy@127.0.0.1"
          mkdir -p "$RUNNER_TEMP/site" && echo "ventura-ok" > "$RUNNER_TEMP/site/index.html"
          (cd "$RUNNER_TEMP/site" && python3 -m http.server 4900 --bind 127.0.0.1 >/dev/null 2>&1 &)
          sleep 1
          # nginx qayta yuklanishi bir zumda emas: javob kelguncha bir necha marta uriniladi
          via_nginx() {
            for _ in $(seq 1 20); do
              [ "$(curl -fsS -H "Host: $1" http://127.0.0.1/ 2>/dev/null)" = "ventura-ok" ] && return 0
              sleep 0.5
            done
            echo "nginx orqali javob kelmadi: $1"
            curl -sS -i -H "Host: $1" http://127.0.0.1/ | head -20 || true
            sudo cat /etc/nginx/conf.d/ventura-demo.conf || true
            return 1
          }
          $SSH 'sudo -n /usr/local/sbin/ventura-site set demo 4900 demo.localhost,demo.ventura.uz'
          via_nginx demo.localhost
          via_nginx demo.ventura.uz
          # Xavfli belgilar bitta argument bo'lib yetib borishi uchun ichki qo'shtirnoq bilan (drayver ham shunday qiladi)
          for bad in "set Demo 4900 demo.localhost" "set demo 80 demo.localhost" "set demo 4900 'a.b;reboot'" "set demo 4900 '\$(id)'" "remove ../nginx"; do
            if $SSH "sudo -n /usr/local/sbin/ventura-site $bad" 2>/dev/null; then echo "rad etilmadi: $bad"; exit 1; fi
          done
          via_nginx demo.localhost
          $SSH 'sudo -n /usr/local/sbin/ventura-site remove demo'
          test ! -e /etc/nginx/conf.d/ventura-demo.conf

      - name: Serverni panelga qo'shish (panel o'z kalitini yaratadi)
        run: |
          pnpm --silent server:add -- --name ci-runner --kind home --host 127.0.0.1 --port 2222 | tee "$RUNNER_TEMP/server-add.txt"
          KEY="$(grep -m1 '^ssh-ed25519 ' "$RUNNER_TEMP/server-add.txt")"
          sudo bash tooling/server/setup.sh --ssh-port 2222 --key "$KEY"
          test "$(sudo grep -c '^restrict ssh-ed25519' /home/deploy/.ssh/authorized_keys)" = "2"
          pnpm --silent server:check -- --name ci-runner

      - name: Sinov loyihalari va ishchi jarayon
        run: |
          pnpm --silent --filter @ventura/scripts e2e:project -- --slug demo-a --name "Demo A" --color "#059669"
          pnpm --silent --filter @ventura/scripts e2e:project -- --slug demo-b --name "Demo B" --color "#7c3aed" --db shared_db --owner-phone +998907654321
          nohup pnpm worker > "$RUNNER_TEMP/worker.log" 2>&1 &
          for _ in $(seq 1 60); do grep -q "worker. tayyor" "$RUNNER_TEMP/worker.log" && break; sleep 1; done
          grep -q "worker. tayyor" "$RUNNER_TEMP/worker.log"

      - name: Birinchi deploy (kod, build, PM2, nginx)
        run: |
          pnpm --silent deploy:run -- --project demo-a | tee "$RUNNER_TEMP/deploy-a.txt"
          grep -q "Deploy tayyor" "$RUNNER_TEMP/deploy-a.txt"
          curl -fsS -H "Host: demo-a.localhost" http://127.0.0.1/health | grep '"tenant":"demo-a"'
          curl -fsS -H "Host: demo-a.ventura.uz" http://127.0.0.1/login | grep -q "Demo A"
          curl -fsS -H "Host: demo-a.ventura.uz" http://127.0.0.1/login | grep -q -- "--primary:#059669"
          # Kirmagan foydalanuvchi /login ga, o'z domeni bilan
          curl -sS -o /dev/null -w "%{redirect_url}" -H "Host: demo-a.ventura.uz" http://127.0.0.1/ | grep -q "://demo-a.ventura.uz/login"
          # Cloudflare Tunnel orqasida: 127.0.0.1 dan kelgan https belgisi va mijoz IP'si ilovaga yetadi (ADR 0049)
          curl -sS -o /dev/null -w "%{redirect_url}" -H "Host: demo-a.ventura.uz" -H "X-Forwarded-Proto: https" -H "CF-Connecting-IP: 203.0.113.7" http://127.0.0.1/ | grep -q "^https://demo-a.ventura.uz/login"
          curl -sS -o /dev/null -w "%{redirect_url}" -H "Host: demo-a.ventura.uz" http://127.0.0.1/ | grep -q "^http://demo-a.ventura.uz/login"
          # Noma'lum domen — 404 (Ubuntu'ning standart sahifasi emas)
          test "$(curl -sS -o /dev/null -w "%{http_code}" -H "Host: yoq-loyiha.ventura.uz" http://127.0.0.1/)" = "404"
          sudo grep -q 'X-Forwarded-Proto \$ventura_proto' /etc/nginx/conf.d/ventura-demo-a.conf

      - name: Ikkinchi mijoz o'sha ilovaga ulanadi (qayta build qilinmaydi)
        run: |
          pnpm --silent deploy:run -- --project demo-b | tee "$RUNNER_TEMP/deploy-b.txt"
          grep -q "kod va build qayta bajarilmaydi" "$RUNNER_TEMP/deploy-b.txt"
          if grep -q "pnpm install" "$RUNNER_TEMP/deploy-b.txt"; then echo "ikkinchi deploy'da qayta o'rnatildi"; exit 1; fi
          curl -fsS -H "Host: demo-b.localhost" http://127.0.0.1/health | grep '"tenant":"demo-b"'
          curl -fsS -H "Host: demo-b.ventura.uz" http://127.0.0.1/login | grep -q "Demo B"
          # birinchi mijoz o'z nomi bilan qolgan
          curl -fsS -H "Host: demo-a.localhost" http://127.0.0.1/health | grep '"tenant":"demo-a"'
          curl -fsS -H "Host: demo-a.ventura.uz" http://127.0.0.1/login | grep -q "Demo A"
          # bitta jarayon ikkalasiga xizmat qiladi
          test "$(sudo -u deploy -i pm2 jlist | python3 -c 'import json,sys; print(len(json.load(sys.stdin)))')" = "1"

      - name: Mijoz bazalari, direktorlar va maxfiy fayl (deploy yaratgan)
        run: |
          # Ilova ikkala mijozni ham "sozlangan" deb biladi (baza va sessiya kaliti bor)
          curl -fsS -H "Host: demo-a.localhost" http://127.0.0.1/health | grep '"configured":true'
          curl -fsS -H "Host: demo-b.localhost" http://127.0.0.1/health | grep '"configured":true'
          # demo-a — alohida baza, demo-b — umumiy baza; har birida formadagi ega direktor bo'lib yaratilgan
          test "$(sudo -u postgres psql -XAtd edu_crm_demo_a -c "select tenant_id||'|'||role||'|'||phone_number||'|'||must_change_password from users")" = "demo-a|director|+998901234567|true"
          test "$(sudo -u postgres psql -XAtd edu_crm_shared -c "select tenant_id||'|'||role||'|'||phone_number from users")" = "demo-b|director|+998907654321"
          # Maxfiy fayl faqat deploy foydalanuvchisiga ochiq, ikkala mijoz ham unda
          test "$(sudo stat -c %a /home/deploy/apps/edu-crm/shared/tenant-secrets.json)" = "600"
          sudo python3 -c 'import json; t=json.load(open("/home/deploy/apps/edu-crm/shared/tenant-secrets.json"))["tenants"]; assert sorted(t)==["demo-a","demo-b"], t'
          # Bir mijoz roli boshqa mijoz bazasiga ulana olmaydi (manzil ekranga chiqarilmaydi)
          B_URL="$(sudo python3 -c 'import json; print(json.load(open("/home/deploy/apps/edu-crm/shared/tenant-secrets.json"))["tenants"]["demo-b"]["databaseUrl"])')"
          psql "$B_URL" -XAtc "select 1" >/dev/null
          if psql "${B_URL%/*}/edu_crm_demo_a" -XAtc "select 1" >/dev/null 2>&1; then echo "umumiy baza roli demo-a bazasiga kirdi"; exit 1; fi
          # Qayta deploy: baza, direktor va kalit o'zgarmaydi (ikkinchi direktor yaratilmaydi).
          # Ilovaga qo'llangan PM2 sozlamasi belgisi yo'q (eski versiyadan qolgan server) — ilova qayta yuklanadi
          sudo rm -f /home/deploy/apps/edu-crm/shared/ecosystem.applied
          pnpm --silent deploy:run -- --project demo-a | tee "$RUNNER_TEMP/deploy-a2.txt"
          grep -q "Direktor allaqachon bor" "$RUNNER_TEMP/deploy-a2.txt"
          grep -q "PM2 sozlamasi o'zgardi" "$RUNNER_TEMP/deploy-a2.txt"
          sudo test -s /home/deploy/apps/edu-crm/shared/ecosystem.applied
          # Sozlama o'zgarmasa ilova qayta yuklanmaydi
          pnpm --silent deploy:run -- --project demo-a | tee "$RUNNER_TEMP/deploy-a3.txt"
          if grep -q "PM2 sozlamasi o'zgardi" "$RUNNER_TEMP/deploy-a3.txt"; then echo "keraksiz qayta yuklash"; exit 1; fi
          test "$(sudo -u postgres psql -XAtd edu_crm_demo_a -c "select count(*) from users")" = "1"
          # Deploy logida sir yo'q
          if grep -E "postgres://[^:]+:[A-Za-z0-9_-]{20,}@" "$RUNNER_TEMP"/deploy-*.txt; then echo "logda baza paroli"; exit 1; fi

      - name: Alohida deploy (dedicated) va rejim almashishi
        run: |
          pnpm --silent --filter @ventura/scripts e2e:project -- --slug demo-c --name "Demo C" --color "#d97706" --mode dedicated --owner-phone +998901112233
          pnpm --silent deploy:run -- --project demo-c | tee "$RUNNER_TEMP/deploy-c.txt"
          grep -q "Deploy tayyor" "$RUNNER_TEMP/deploy-c.txt"
          grep -q "alohida ilova edu-crm-demo-c" "$RUNNER_TEMP/deploy-c.txt"
          curl -fsS -H "Host: demo-c.localhost" http://127.0.0.1/health | grep '"tenant":"demo-c"'
          curl -fsS -H "Host: demo-c.ventura.uz" http://127.0.0.1/login | grep -q "Demo C"
          # O'z jarayoni (umumiy ilova + alohida), o'z ro'yxati va maxfiy fayli — faqat demo-c; umumiy ilovada u yo'q
          test "$(sudo -u deploy -i pm2 jlist | python3 -c 'import json,sys; print(sorted(p["name"] for p in json.load(sys.stdin)))')" = "['edu-crm', 'edu-crm-demo-c']"
          sudo python3 -c 'import json; t=json.load(open("/home/deploy/apps/edu-crm-demo-c/shared/tenants.json"))["tenants"]; assert [x["slug"] for x in t]==["demo-c"], t'
          sudo python3 -c 'import json; t=json.load(open("/home/deploy/apps/edu-crm-demo-c/shared/tenant-secrets.json"))["tenants"]; assert sorted(t)==["demo-c"], t'
          sudo python3 -c 'import json; t=json.load(open("/home/deploy/apps/edu-crm/shared/tenants.json"))["tenants"]; assert "demo-c" not in [x["slug"] for x in t], t'
          test "$(sudo -u postgres psql -XAtd edu_crm_demo_c -c "select tenant_id||'|'||role from users")" = "demo-c|director"
          # Boshqa mijozlar ishlashda davom etadi
          curl -fsS -H "Host: demo-a.localhost" http://127.0.0.1/health | grep '"tenant":"demo-a"'
          curl -fsS -H "Host: demo-b.localhost" http://127.0.0.1/health | grep '"tenant":"demo-b"'
          # Band serverga alohida server bazali loyiha qo'yib bo'lmaydi (build boshlanmasdan to'xtaydi)
          pnpm --silent --filter @ventura/scripts e2e:project -- --slug demo-d --name "Demo D" --mode dedicated --db dedicated_server
          if pnpm --silent deploy:run -- --project demo-d > "$RUNNER_TEMP/deploy-d.txt" 2>&1; then echo "band serverga dedicated_server qo'yildi"; exit 1; fi
          grep -q "server bo'sh bo'lishi kerak\|Bo'sh online VPS yo'q\|Bo'sh uydagi server yo'q" "$RUNNER_TEMP/deploy-d.txt"
          # dedicated → shared: umumiy ilovaga qaytadi (qayta build yo'q), alohida jarayon to'xtaydi, baza o'sha
          pnpm --silent --filter @ventura/scripts e2e:project -- --slug demo-c --mode shared
          pnpm --silent deploy:run -- --project demo-c | tee "$RUNNER_TEMP/deploy-c2.txt"
          grep -q "kod va build qayta bajarilmaydi" "$RUNNER_TEMP/deploy-c2.txt"
          grep -q "Alohida ilova (edu-crm-demo-c) to'xtatildi" "$RUNNER_TEMP/deploy-c2.txt"
          curl -fsS -H "Host: demo-c.localhost" http://127.0.0.1/health | grep '"tenant":"demo-c"'
          test "$(sudo -u deploy -i pm2 jlist | python3 -c 'import json,sys; print(sorted(p["name"] for p in json.load(sys.stdin)))')" = "['edu-crm']"
          test "$(sudo -u postgres psql -XAtd edu_crm_demo_c -c "select count(*) from users")" = "1"

      - name: Yiqilganda tafsilot
        if: failure()
        run: |
          echo "--- worker"; tail -100 "$RUNNER_TEMP/worker.log" || true
          echo "--- pm2"; sudo -u deploy -i pm2 logs --nostream --lines 60 || true
          echo "--- nginx"; sudo ls -la /etc/nginx/conf.d/ || true
          echo "--- tenants"; sudo cat /home/deploy/apps/edu-crm/shared/tenants.json || true
