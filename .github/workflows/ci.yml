name: CI

# PR'da bir marta ishlaydi; push'da faqat main (PR branch'iga push qilinganda ikki marta ishlamasin)
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: 1
  NEXT_TELEMETRY_DISABLED: 1

jobs:
  ci:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm versiyasi package.json dagi "packageManager" dan olinadi
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Formatlash (Prettier)
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: e2e · kirish + 2FA, yangi loyiha formasi
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: ventura
          POSTGRES_PASSWORD: e2e
          POSTGRES_DB: ventura_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ventura -d ventura_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Faqat shu vazifa ichidagi vaqtinchalik baza; haqiqiy sirlar emas
      E2E_DATABASE_URL: postgres://ventura_app:e2e@localhost:5432/ventura_e2e
      E2E_MIGRATE_URL: postgres://ventura:e2e@localhost:5432/ventura_e2e
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Bog'liqliklar
        run: pnpm install --frozen-lockfile

      - name: Panel roli (audit jadvalini o'zgartira olmaydigan)
        run: psql "$E2E_MIGRATE_URL" -v ON_ERROR_STOP=1 -f apps/panel/e2e/roles.sql

      - name: Playwright brauzeri
        run: pnpm --filter @ventura/panel exec playwright install --with-deps chromium

      - name: Build
        run: pnpm --filter @ventura/panel build

      - name: E2E
        run: pnpm e2e

      - name: Yiqilgan test izlari
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: apps/panel/test-results
          retention-days: 7

  server-setup:
    # tooling/server/setup.sh haqiqiy Ubuntu'da sinaladi: runner bir martalik mashina, root huquqi bor
    name: server · setup.sh
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Toza serverga o'xshatish (runner'dagi tayyor Node olib tashlanadi)
        run: sudo rm -f /usr/local/bin/node /usr/local/bin/npm /usr/local/bin/npx /usr/local/bin/corepack /usr/local/bin/pnpm /usr/local/bin/pm2

      - name: Panel kaliti (faqat shu sinov uchun)
        run: ssh-keygen -t ed25519 -N "" -C ventura-panel:ci -f "$RUNNER_TEMP/panel_key" -q

      - name: setup.sh
        run: sudo bash tooling/server/setup.sh --ssh-port 2222 --key "$(cat "$RUNNER_TEMP/panel_key.pub")"

      - name: Qayta ishga tushirish xavfsiz
        run: sudo bash tooling/server/setup.sh --ssh-port 2222 --key "$(cat "$RUNNER_TEMP/panel_key.pub")"

      - name: Panel kaliti bilan kirish, dasturlar va huquqlar
        run: |
          SSH="ssh -p 2222 -i $RUNNER_TEMP/panel_key -o StrictHostKeyChecking=no -o BatchMode=yes deploy@127.0.0.1"
          $SSH 'bash -lc "node --version && pnpm --version && pm2 --version && psql --version"'
          $SSH 'sudo -n /usr/local/sbin/ventura-site check'
          test "$(sudo grep -c ventura-panel:ci /home/deploy/.ssh/authorized_keys)" = "1"
          # deploy root nomidan boshqa hech narsa ishlata olmaydi
          if $SSH 'sudo -n id' 2>/dev/null; then echo "deploy'da ortiqcha sudo huquqi bor"; exit 1; fi
          # parol bilan kirib bo'lmaydi
          if ssh -p 2222 -o StrictHostKeyChecking=no -o BatchMode=yes -o PubkeyAuthentication=no deploy@127.0.0.1 true 2>/dev/null; then exit 1; fi

      - name: nginx yordamchisi (ventura-site)
        run: |
          SSH="ssh -p 2222 -i $RUNNER_TEMP/panel_key -o StrictHostKeyChecking=no -o BatchMode=yes deploy@127.0.0.1"
          mkdir -p "$RUNNER_TEMP/site" && echo "ventura-ok" > "$RUNNER_TEMP/site/index.html"
          (cd "$RUNNER_TEMP/site" && python3 -m http.server 4100 --bind 127.0.0.1 >/dev/null 2>&1 &)
          # nginx qayta yuklanishi bir zumda emas: javob kelguncha bir necha marta uriniladi
          via_nginx() {
            for _ in $(seq 1 20); do
              [ "$(curl -fsS -H "Host: $1" http://127.0.0.1/ 2>/dev/null)" = "ventura-ok" ] && return 0
              sleep 0.5
            done
            echo "nginx orqali javob kelmadi: $1"
            curl -sS -i -H "Host: $1" http://127.0.0.1/ | head -20 || true
            curl -sS -i http://127.0.0.1:4100/ | head -5 || true
            sudo cat /etc/nginx/conf.d/ventura-demo.conf || true
            return 1
          }
          $SSH 'sudo -n /usr/local/sbin/ventura-site set demo 4100 demo.localhost,demo.ventura.uz'
          via_nginx demo.localhost
          via_nginx demo.ventura.uz
          # noto'g'ri kirish rad etiladi va sozlama o'zgarmaydi
          for bad in 'set Demo 4100 demo.localhost' 'set demo 80 demo.localhost' 'set demo 4100 a.b;reboot' 'remove ../nginx'; do
            if $SSH "sudo -n /usr/local/sbin/ventura-site $bad" 2>/dev/null; then echo "rad etilmadi: $bad"; exit 1; fi
          done
          via_nginx demo.localhost
          $SSH 'sudo -n /usr/local/sbin/ventura-site remove demo'
          test ! -e /etc/nginx/conf.d/ventura-demo.conf
